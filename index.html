function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function hash(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);}
function starPath(x,y,r1,r2,n,rot){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=rot+i*Math.PI/n-Math.PI/2;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();}

 const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+0.02);}

// Every coin/item is checked against all solid rects (moving platforms use their whole travel area), spikes, springs and peels.
function validatePlacement(L){
 const rects=[];
 for(const s of L.solids){const ax=s.ax||0,ay=s.ay||0;rects.push({x:s.x0-ax,y:s.y0-ay,w:s.w+ax*2,h:(s.ground?H+200-s.y0:s.h)+ay*2});}
 for(const s of L.spikes)rects.push(s);for(const s of L.springs)rects.push({x:s.x,y:s.y-6,w:s.w,h:s.h+6});for(const b of L.bananas)rects.push(b);
 rects.push({x:L.flag.x-20,y:GROUND-190,w:110,h:190});
 const bad=(o,r)=>{const m=10;for(const q of rects)if(o.x+r+m>q.x&&o.x-r-m<q.x+q.w&&o.y+r+m>q.y&&o.y-r-m<q.y+q.h)return true;return false;};
 const fix=(list,r)=>list.filter(o=>{if(!bad(o,r))return true;const y0=o.y;
   for(let d=4;d<=130;d+=4){o.y=y0-d;if(o.y>40&&!bad(o,r))return true;}
   for(let d=4;d<=40;d+=4){o.y=y0+d;if(!bad(o,r))return true;}
   L.dropped++;return false;});
 L.coins=fix(L.coins,12);L.items=fix(L.items,18);
 // keep coins from stacking on top of each other after nudging

// ---------- main loop ----------
let last=performance.now(),acc=0;const STEP=1/120;
function frame(now){

 if(pausePressed){if(state==='play')state='pause';else if(state==='pause')state='play';pausePressed=false;}
 if(startPressed){
  const wasPlay=state==='play';
  if(state==='title'||state==='over')newGame();
  else if(state==='win'&&clearT>1.5){state='title';fx=[];}
  else if(state==='pause'&&touchUI)state='play';
  startPressed=false;if(state==='play'&&!wasPlay)jumpPressed=false;
 }
 acc+=d;while(acc>=STEP){update(STEP);jumpPressed=false;throwPressed=false;acc-=STEP;}

}
